# 官方 RSS 插件：python 标准库后端，页面和代码经 configs 交进容器，数据在 /data。
services:
  app:
    # 上游官方镜像，按清单列表摘要固定（多架构写 index 的摘要），标签只给人看。
    image: python:3.15-alpine3.23@sha256:8d77d813a53e534dec9e1e5182cbd5b651b70d63b27e4ea7c1f616b37cf9aad2
    # 不加 init 时 python 是 1 号进程，不响应 SIGTERM，每次更新都多等 10 秒。
    init: true
    command: ["python3", "/app/server.py"]
    # 数据目录里的文件归主人的用户；configs 按插值后的 uid:gid 取属主，默认 0444 所有人可读。
    user: "${PUID}:${PGID}"
    volumes:
      - ${WONTON_APP_DATA}:/data
    configs:
      - source: server
        target: /app/server.py
      - source: page
        target: /app/index.html
    healthcheck:
      # python3 -c 的写法核心不改写成不走代理，用空 ProxyHandler 直连本机。
      test: ["CMD", "python3", "-c", "import urllib.request as r; r.build_opener(r.ProxyHandler({})).open('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 1s

configs:
  server:
    file: server.py
  page:
    file: web/index.html

x-wonton:
  spec: "0.5"
  id: app.wonton.rss
  version: 0.1.2
  kind: app
  title: { zh: 简易订阅, en: Simple Feeds }
  description: { zh: 最简单的订阅：贴一个网站的订阅链接，文章就出现在 App 的“动态”页里，点开就能读，想看最新的点一下刷新。适合只想偶尔看看几个网站更新的人。, en: "The simplest way to follow websites: paste a site's feed link and its articles appear on the app's Feed page, ready to read; tap refresh for the latest. For checking in on a few sites now and then." }
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/home.png, screenshots/article.png]
  author: { name: Wonton }
  # 应用就是本仓库的后端和页面，许可证即 LICENSE 里的 MIT。
  license: MIT
  tags:
    zh: [资讯, 工具]
    en: [News, Tools]
  about:
    zh: |
      在 App 的“动态”页看自己订阅的网站更新：贴上订阅链接就能抓来文章，点开读正文。

      添加订阅链接就能抓文章，点开读正文；单个订阅可以刷新或删除，
      全部订阅一键刷新。抓不到的订阅如实标出原因，不假装正常。
      页面只在登录后能打开，数据都存在自己家里。
    en: |
      Read updates from the sites you follow on the app's Feed page: paste a feed link and its articles are fetched for you, ready to read.

      Add a feed link to fetch articles, tap one to read it; refresh or delete
      each feed, or refresh all at once. Feeds that cannot be fetched say why
      instead of pretending. Only signed-in users can open the page, and the
      data stays on your own server.
  release_notes: { zh: 运行时镜像升到 Python 3.15。, en: "The runtime image moves to Python 3.15." }
  webui:
    service: app
    port: 8080
    # sso: none（默认）：本插件没有账号体系，页面全靠核心网关的会话把守。
  tabs:
    - id: feed
      title: { zh: 动态, en: Feed }
      icon: tabs/feed.svg
      icon_selected: tabs/feed-fill.svg
      path: /
      layout: edge-to-edge
  # 抓订阅源要出网（也意味着能访问局域网，安装确认会写明）。
  permissions: [network.egress]
  # 上游 python:alpine 没写最低内存，按本机空闲实测取整（实测约 30M，取 64M）。
  requirements:
    arch: [amd64, arm64]
    memory: 64M
